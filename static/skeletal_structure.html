<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Pattern Visualization</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        canvas { background: #eee; margin-top: 20px; }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>
    <h2>Walking Pattern Visualization</h2>
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="controls">
        <div class="control-group">
            <label>Hip Angle: <input type="range" id="hip" min="-90" max="90" value="0"></label>
            <label>Knee Angle: <input type="range" id="knee" min="-90" max="90" value="0"></label>
            <label>Foot Angle: <input type="range" id="foot" min="-90" max="90" value="0"></label>
        </div>
        <div class="control-group">
            <label>Second Foot Angle: <input type="range" id="foot2" min="-90" max="90" value="0"></label>
        </div>
    </div>
    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        const hipInput = document.getElementById("hip");
        const kneeInput = document.getElementById("knee");
        const footInput = document.getElementById("foot");
        const foot2Input = document.getElementById("foot2");

        let secondHipAngle = 0; // Controlled by BLE data from Sensor 1
        let secondKneeAngle = 0; // Controlled by BLE data from Sensor 2

        function drawSkeletal(hipAngle, kneeAngle, footAngle, foot2Angle, hip2Angle, knee2Angle) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const hip = { x: 200, y: 200 };
            ctx.fillStyle = "gray";
            ctx.beginPath();
            ctx.ellipse(hip.x, hip.y - 50, 25, 60, 0, 0, Math.PI * 2);
            ctx.fill();

            function calculateJointPosition(start, angle, length) {
                return {
                    x: start.x + length * Math.sin((angle * Math.PI) / 180),
                    y: start.y + length * Math.cos((angle * Math.PI) / 180)
                };
            }

            const knee = calculateJointPosition(hip, hipAngle, 50);
            const foot = calculateJointPosition(knee, kneeAngle, 50);
            const toe = calculateJointPosition(foot, footAngle, 30);

            const knee2 = calculateJointPosition(hip, hip2Angle, 50);
            const foot2 = calculateJointPosition(knee2, knee2Angle, 50);
            const toe2 = calculateJointPosition(foot2, foot2Angle, 30);

            ctx.strokeStyle = "black";
            ctx.lineWidth = 4;

            ctx.beginPath();
            ctx.moveTo(hip.x, hip.y);
            ctx.lineTo(knee.x, knee.y);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(knee.x, knee.y);
            ctx.lineTo(foot.x, foot.y);
            ctx.stroke();

            ctx.strokeStyle = "blue";
            ctx.beginPath();
            ctx.moveTo(foot.x, foot.y);
            ctx.lineTo(toe.x, toe.y);
            ctx.stroke();

            ctx.strokeStyle = "black";
            ctx.beginPath();
            ctx.moveTo(hip.x, hip.y);
            ctx.lineTo(knee2.x, knee2.y);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(knee2.x, knee2.y);
            ctx.lineTo(foot2.x, foot2.y);
            ctx.stroke();

            ctx.strokeStyle = "red";
            ctx.beginPath();
            ctx.moveTo(foot2.x, foot2.y);
            ctx.lineTo(toe2.x, toe2.y);
            ctx.stroke();
        }

        function update() {
            drawSkeletal(
                parseInt(hipInput.value), parseInt(kneeInput.value), parseInt(footInput.value),
                parseInt(foot2Input.value), secondHipAngle, secondKneeAngle
            );
        }

        [hipInput, kneeInput, footInput, foot2Input].forEach(input =>
            input.addEventListener("input", update));

        update();

        // WebSocket connection to receive roll values from Python script
        const socket = new WebSocket("ws://localhost:8765");
        socket.onmessage = function(event) {
            const [sensor, value] = event.data.split(":");
            if (sensor === "SENSOR1") {
                secondHipAngle = parseInt(value); // Assign roll to hip2 angle
            } else if (sensor === "SENSOR2") {
                secondKneeAngle = parseInt(value); // Assign roll to knee2 angle
            }
            update();
        };
    </script>
</body>
</html>
